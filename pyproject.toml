[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "polarion-alm-mcp"
dynamic = ["version"]
description = "Polarion ALM MCP server launcher for requirements, LiveDocs, work items and test management"
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Phillip Bösger"}]
keywords = ["polarion", "alm", "mcp", "model-context-protocol", "requirements", "test-management", "claude"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://polarion-mcp.boesger.com/"
Documentation = "https://github.com/phillipboesger/polarion-mcp#readme"
Repository = "https://github.com/phillipboesger/polarion-mcp"
Issues = "https://github.com/phillipboesger/polarion-mcp/issues"
Changelog = "https://github.com/phillipboesger/polarion-mcp/blob/main/CHANGELOG.md"

[project.scripts]
polarion-alm-mcp = "polarion_alm_mcp:main"

[tool.hatch.version]
path = "python/polarion_alm_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/polarion_alm_mcp"]

[tool.hatch.build.targets.sdist]
include = ["python/", "pyproject.toml", "LICENSE"]
