# Throwaway values used only by tests; none of them is a real credential.
# Uses the singular [allowlist] table: the gitleaks-action pins 8.24.x, which predates [[allowlists]].
[extend]
useDefault = true

[allowlist]
description = "Test-only TLS fixtures and fixed token secrets, and YOUR_* placeholders in the setup guides"
regexes = ['''YOUR_[A-Z_]+''']
paths = [
  '''tests/fixtures/cimd-test-(key|cert)\.pem''',
  '''tests/[A-Za-z0-9_./-]+\.test\.ts''',
]
