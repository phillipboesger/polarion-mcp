name: Mutation tests

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [oauth, sealed, guards, tool-filter, executor]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:mutation:module
        env:
          MUTATION_MODULE: ${{ matrix.module }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-reports-${{ matrix.module }}
          path: reports/mutation/
          if-no-files-found: warn
