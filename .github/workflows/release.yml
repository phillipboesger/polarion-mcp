name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Assemble release ZIP
        id: pack
        run: |
          set -euo pipefail
          NAME="polarion-mcp"
          ZIP="${NAME}-${GITHUB_REF_NAME}.zip"
          rm -rf dist-stage && mkdir -p "dist-stage/${NAME}"
          cp -r build package.json package-lock.json sdk README.md LICENSE .env.example "dist-stage/${NAME}/"
          ( cd dist-stage && zip -qr "../${ZIP}" "${NAME}" )
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Verify release ZIP runs (install + MCP initialize)
        run: |
          set -euo pipefail
          ZIP="${{ steps.pack.outputs.zip }}"
          rm -rf _verify && mkdir _verify
          unzip -q "${ZIP}" -d _verify
          cd _verify/polarion-mcp

          # Exactly what users run, lifecycle scripts included.
          npm ci --omit=dev
          test -f build/index.js || { echo "::error::npm ci removed build/"; exit 1; }

          # The server holds no credentials in HTTP mode: it asks Polarion whether the
          # caller's PAT is valid before opening a session. A stand-in Polarion
          # accepts exactly this one PAT.
          export CALLER_PAT="ci-verify-pat"
          node -e "require('http').createServer((q, r) => { r.writeHead(q.headers.authorization === 'Bearer ' + process.env.CALLER_PAT ? 200 : 401, { 'content-type': 'application/json' }); r.end('{\"data\":[]}'); }).listen(3011)" & FAKE=$!
          export API_BASE_URL="http://localhost:3011/polarion/rest/v1"
          export MCP_HTTP_PORT="3010"

          node build/mcp-http-server.js & SRV=$!
          trap 'kill ${SRV} ${FAKE} 2>/dev/null || true' EXIT

          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:3010/health >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          test "${ok}" = "1" || { echo "::error::server did not become healthy"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3010/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')"
          test "${code}" = "401" || { echo "::error::expected 401 without token, got ${code}"; exit 1; }

          body="$(curl -s -D headers.txt -X POST http://localhost:3010/mcp \
            -H "authorization: Bearer ${CALLER_PAT}" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}')"
          echo "${body}" | grep -q '"serverInfo"' || { echo "::error::initialize failed: ${body}"; exit 1; }
          grep -qi '^mcp-session-id:' headers.txt || { echo "::error::missing mcp-session-id header"; exit 1; }

          echo "Release ZIP verified: production install succeeds, server starts, MCP initialize works."

      - name: Pack Claude Desktop Extension
        id: mcpb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="${RUNNER_TEMP}/polarion-mcp-mcpb"
          BUNDLE="${RUNNER_TEMP}/polarion-mcp-v${VERSION}.mcpb"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          npm prune --omit=dev
          cp -r build node_modules package.json "${STAGE}/"
          cp mcpb/manifest.json "${STAGE}/manifest.json"
          npx --yes @anthropic-ai/mcpb pack "${STAGE}" "${BUNDLE}"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          ls -lh "${BUNDLE}"

      - name: Generate CycloneDX SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TARBALL="polarion-mcp-${GITHUB_REF_NAME#v}.tgz"
          npm pack --pack-destination .
          mv "polarion-mcp-${GITHUB_REF_NAME#v}.tgz" "${TARBALL}"
          npx --yes @cyclonedx/cyclonedx-npm --output-file "polarion-mcp-${GITHUB_REF_NAME}.bom.json"

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.mcpb.outputs.bundle }}
            polarion-mcp-${{ github.ref_name }}.tgz
            polarion-mcp-${{ github.ref_name }}.bom.json

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN not set, skipping npm publish"
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --provenance --access public

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.zip }}" "${{ steps.mcpb.outputs.bundle }}" "polarion-mcp-${GITHUB_REF_NAME#v}.tgz" "polarion-mcp-${GITHUB_REF_NAME}.bom.json" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.zip }}" "${{ steps.mcpb.outputs.bundle }}" "polarion-mcp-${GITHUB_REF_NAME#v}.tgz" "polarion-mcp-${GITHUB_REF_NAME}.bom.json" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
