name: Python package

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths: ['python/**', 'pyproject.toml', 'tests/python/**', '.github/workflows/pypi-publish.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install build twine
      - name: Check matching release versions
        run: |
          python - <<'PY'
          import json, runpy, os
          version = runpy.run_path('python/polarion_alm_mcp/__init__.py')['__version__']
          assert version == json.load(open('package.json'))['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - run: python -m unittest discover -s tests/python
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify wheel entry point
        run: |
          python -m pip install dist/*.whl
          polarion-alm-mcp --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polarion-alm-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
