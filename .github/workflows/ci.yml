name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  package:
    name: Build and verify release ZIP
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Assemble release ZIP
        id: pack
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="polarion-mcp"
          ZIP="${NAME}-v${VERSION}.zip"
          rm -rf dist-stage && mkdir -p "dist-stage/${NAME}"
          # Slim, runnable distribution (production install required at use time).
          cp -r build package.json package-lock.json sdk README.md LICENSE .env.example "dist-stage/${NAME}/"
          ( cd dist-stage && zip -qr "../${ZIP}" "${NAME}" )
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "Created ${ZIP}:"
          unzip -l "${ZIP}"

      - name: Verify release ZIP runs (install + MCP initialize)
        run: |
          set -euo pipefail
          ZIP="${{ steps.pack.outputs.zip }}"
          rm -rf _verify && mkdir _verify
          unzip -q "${ZIP}" -d _verify
          cd _verify/polarion-mcp

          # Exactly what users run (docs/repository-overview.md), lifecycle scripts
          # included: a prepare hook that rebuilds would delete the shipped build/.
          npm ci --omit=dev
          test -f build/index.js || { echo "::error::npm ci removed build/"; exit 1; }

          # The server holds no credentials in HTTP mode: it asks Polarion whether the
          # caller's PAT is valid before opening a session. A stand-in Polarion
          # accepts exactly this one PAT.
          export CALLER_PAT="ci-verify-pat"
          node -e "require('http').createServer((q, r) => { r.writeHead(q.headers.authorization === 'Bearer ' + process.env.CALLER_PAT ? 200 : 401, { 'content-type': 'application/json' }); r.end('{\"data\":[]}'); }).listen(3011)" & FAKE=$!
          export API_BASE_URL="http://localhost:3011/polarion/rest/v1"
          export MCP_HTTP_PORT="3010"

          node build/mcp-http-server.js & SRV=$!
          trap 'kill ${SRV} ${FAKE} 2>/dev/null || true' EXIT

          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:3010/health >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          test "${ok}" = "1" || { echo "::error::server did not become healthy"; exit 1; }

          # Unauthenticated requests must be rejected.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3010/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')"
          test "${code}" = "401" || { echo "::error::expected 401 without token, got ${code}"; exit 1; }

          # Authenticated MCP initialize must succeed and hand out a session id.
          body="$(curl -s -D headers.txt -X POST http://localhost:3010/mcp \
            -H "authorization: Bearer ${CALLER_PAT}" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}')"
          echo "${body}" | grep -q '"serverInfo"' || { echo "::error::initialize failed: ${body}"; exit 1; }
          grep -qi '^mcp-session-id:' headers.txt || { echo "::error::missing mcp-session-id header"; exit 1; }

          echo "Release ZIP verified: production install succeeds, server starts, MCP initialize works."

      - name: Verify the stdio bin runs directly (shebang, MCP initialize)
        run: |
          set -euo pipefail
          cd _verify/polarion-mcp
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          # The server exits on its own when stdin closes; a crash or a timeout (124) fails the step.
          rc=0
          out="$(echo "${INIT}" | API_BASE_URL=https://polarion.example.com/polarion/rest/v1 BEARER_TOKEN=x timeout 20 ./build/index.js)" || rc=$?
          test "${rc}" = "0" || { echo "::error::stdio server exited with ${rc}: ${out}"; exit 1; }
          echo "${out}" | grep -q '"serverInfo"' || { echo "::error::stdio initialize failed: ${out}"; exit 1; }

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: polarion-mcp-dist
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

  docker:
    name: Build Docker image and smoke-test stdio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t polarion-mcp:ci .

      - name: MCP initialize over stdio inside the image
        run: |
          set -euo pipefail
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          rc=0
          out="$(echo "${INIT}" | timeout 30 docker run -i --rm -e API_BASE_URL=https://polarion.example.com/polarion/rest/v1 -e BEARER_TOKEN=x polarion-mcp:ci node build/index.js)" || rc=$?
          test "${rc}" = "0" || { echo "::error::stdio server in the image exited with ${rc}: ${out}"; exit 1; }
          echo "${out}" | grep -q '"serverInfo"' || { echo "::error::stdio initialize in the image failed: ${out}"; exit 1; }

      - name: Default command (HTTP server) answers /health and refuses an anonymous /mcp
        run: |
          set -euo pipefail
          docker run -d --rm --name mcp-ci -p 3010:3000 -e API_BASE_URL=https://polarion.example.com/polarion/rest/v1 polarion-mcp:ci
          trap 'docker stop mcp-ci >/dev/null 2>&1 || true' EXIT
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:3010/health >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          test "${ok}" = "1" || { docker logs mcp-ci; echo "::error::image did not become healthy"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3010/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{}')"
          test "${code}" = "401" || { echo "::error::expected 401 without token, got ${code}"; exit 1; }
