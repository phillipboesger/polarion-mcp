name: Live Polarion

# Runs the built server against a real Polarion (a throwaway container started
# from ghcr.io/phillipboesger/polarion-docker). The unit tests stub Polarion, so
# only this job can show what Polarion really answers. It takes about 10 minutes
# because Polarion has to boot, so it runs for changes to the server and not for
# docs.
#
# The image is private. The package grants this repository read access
# ("Manage Actions access" in the package settings), so the workflow's own
# short-lived GITHUB_TOKEN is enough and no long-lived secret exists.
# Pull requests from forks and from Dependabot get no such access; the job is
# skipped for them.

on:
  push:
    # The job guard below limits push runs to main and version tags.
  pull_request:
    paths:
      - "src/**"
      - "tests/live/**"
      - "tests/**"
      - "scripts/live/**"
      - "scripts/**"
      - "Dockerfile"
      - "Dockerfile.*"
      - "setup/**"
      - "docs/**"
      - "README.md"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-polarion.yml"
  schedule:
    # Nightly 05:00 UTC: catches a changed Polarion image without a code change.
    - cron: "0 5 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: live-polarion-${{ github.ref }}
  # Only superseded PR runs are cancelled; a main push or the weekly run must finish to leave a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provision-matrix:
    name: Bootstrap Polarion ${{ matrix.polarion }} permission matrix
    # The package token is available only to trusted repository PRs and maintainer runs.
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        polarion: ["2512", "2606"]
    env:
      IMAGE: ghcr.io/phillipboesger/polarion-docker:v${{ matrix.polarion }}
      POLARION_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install, build, and install Chromium dependencies
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y apache2-utils

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start fresh Polarion
        run: |
          docker pull "$IMAGE"
          docker run -d --name polarion --platform linux/amd64 \
            --label io.polarion-mcp.live-test=true \
            -p 8080:80 --memory 8g --shm-size=256m \
            -e JAVA_OPTS="-Xmx3g -Xms1g" \
            "$IMAGE"

      - name: Wait for Polarion and activate the trial
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for _ in $(seq 1 120); do
            code=$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/" || true)
            [ "$code" = "200" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' polarion 2>/dev/null || true)" = "true" ] || fail "container stopped before Polarion became ready (HTTP $code)"
            sleep 10
          done
          code=$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/" || true)
          [ "$code" = "200" ] || fail "Polarion did not become ready within 20 minutes (HTTP $code)"

          activation=$(curl -fsS -X POST "$POLARION_URL/polarion/activate/entry" \
            -H "Content-Type: application/x-www-form-urlencoded" --data "trial=true" \
            | jq -e -c 'select(.activated == true)') || fail "trial activation failed"
          echo "Trial activation confirmed: $activation"

          # REST answers 401 without a token once the activated repository is ready.
          for _ in $(seq 1 60); do
            code=$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/rest/v1/projects" || true)
            [ "$code" = "401" ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' polarion 2>/dev/null || true)" = "true" ] || fail "container stopped while REST was starting (HTTP $code)"
            sleep 10
          done
          fail "REST API did not reach expected unauthenticated HTTP 401"

      - name: Provision users and permission matrix
        env:
          CREDENTIALS_FILE: ${{ runner.temp }}/credentials.json
          EVIDENCE_FILE: ${{ runner.temp }}/permission-matrix-evidence.json
        run: |
          set +x
          node scripts/live/provision-users.mjs \
            --container polarion \
            --url "$POLARION_URL" \
            --project drivepilot \
            --output "$CREDENTIALS_FILE" \
            > "$RUNNER_TEMP/provisioner-private.log" 2>&1
          test -s "$CREDENTIALS_FILE"

          # Register masks before any later step can print process output or derived data.
          node --input-type=module - "$CREDENTIALS_FILE" <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const key of ['adminPat', 'projectPat']) {
            if (typeof data[key] !== 'string' || !data[key]) throw new Error(`Missing ${key}`);
            process.stdout.write(`::add-mask::${data[key]}\n`);
          }
          if (typeof data.version !== 'string' || !data.version || !data.matrix || typeof data.matrix !== 'object') {
            throw new Error('Provisioner output is missing version or matrix evidence');
          }
          const redact = value => {
            if (Array.isArray(value)) return value.map(redact);
            if (value && typeof value === 'object') return Object.fromEntries(
              Object.entries(value)
                .filter(([key]) => !/(adminpat|projectpat|token|password|credential|secret)/i.test(key))
                .map(([key, child]) => [key, redact(child)]),
            );
            return value;
          };
          const matrix = redact(data.matrix);
          if (!matrix || typeof matrix !== 'object' || Object.keys(matrix).length === 0) {
            throw new Error('Permission matrix evidence is empty after redaction');
          }
          fs.writeFileSync(process.env.EVIDENCE_FILE, JSON.stringify({
            version: data.version,
            matrix,
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Validate redacted matrix evidence
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/permission-matrix-evidence.json
        run: |
          jq -e '(.version | type == "string" and length > 0) and
            (.matrix | (type == "object" or type == "array") and length > 0)' "$EVIDENCE_FILE" >/dev/null
          echo "Permission matrix provisioned for Polarion ${{ matrix.polarion }}"

      - name: Upload redacted permission matrix evidence
        uses: actions/upload-artifact@v7
        with:
          name: polarion-${{ matrix.polarion }}-permission-matrix
          path: ${{ runner.temp }}/permission-matrix-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean up credentials and owned Polarion container
        if: always()
        env:
          CREDENTIALS_FILE: ${{ runner.temp }}/credentials.json
        run: |
          rm -f "$CREDENTIALS_FILE"
          rm -f "$RUNNER_TEMP/provisioner-private.log"
          docker rm -f polarion >/dev/null 2>&1 || true

  live:
    name: Polarion ${{ matrix.polarion }}
    # Fork and Dependabot PRs get a read-only token without package access.
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Playwright 1.52 used for PAT creation supports Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pin the tag: ":latest" follows the newest release and would change under us.
        polarion: ["2506", "2606"]
    env:
      IMAGE: ghcr.io/phillipboesger/polarion-docker:v${{ matrix.polarion }}
      POLARION_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Polarion
        run: |
          docker pull "$IMAGE"
          docker run -d --name polarion --platform linux/amd64 \
            -p 8080:80 --memory 8g --shm-size=256m \
            -e JAVA_OPTS="-Xmx3g -Xms1g" \
            "$IMAGE"

      - name: Wait for Polarion and activate the trial
        run: |
          fail() { echo "::error::$1"; docker logs polarion --tail 100 || true; docker exec polarion sh -c 'tail -n 300 /var/log/polarion/polarion.log' || true; exit 1; }

          # The activation page answers 200 once the web application is up.
          for _ in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/")" = "200" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' polarion)" = "true" ] || fail "container stopped"
            sleep 10
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/")" = "200" ] || fail "Polarion did not come up in 20 minutes"

          curl -fsS -X POST "$POLARION_URL/polarion/activate/entry" \
            -H "Content-Type: application/x-www-form-urlencoded" --data "trial=true" | tee /dev/stderr | grep -q '"activated":true' \
            || fail "trial activation failed"

          # REST answers 401 without a token once the repository is ready.
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$POLARION_URL/polarion/rest/v1/projects")" = "401" ] && exit 0
            sleep 10
          done
          fail "the REST API did not come up"

      - name: Create a personal access token
        # Polarion has no API for this. The script drives the token page of the UI;
        # Playwright is installed next to a copy of it, not into this package.
        run: |
          dir="$RUNNER_TEMP/pat"
          mkdir -p "$dir"
          cp scripts/live/create-pat.mjs "$dir/"
          cd "$dir"
          npm init -y >/dev/null
          npm install --silent playwright@1.52.0
          npx playwright install --with-deps chromium
          PAT=$(node create-pat.mjs)
          echo "::add-mask::$PAT"
          echo "LIVE_PAT=$PAT" >> "$GITHUB_ENV"

      - name: Run the live suite
        run: npm run test:live
        env:
          LIVE_API_BASE_URL: ${{ env.POLARION_URL }}/polarion/rest/v1

      - name: Polarion log on failure
        if: failure()
        run: |
          docker logs polarion --tail 100 || true
          docker exec polarion sh -c 'tail -n 400 /var/log/polarion/polarion.log' || true
