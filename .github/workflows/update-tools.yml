name: Update Polarion tools

# Regenerates src/tools.ts from a Polarion OpenAPI definition and opens a pull
# request when the tool set changed. Run it manually whenever you move to a newer
# Polarion version (point spec_url at that version's published REST spec), or let
# the weekly schedule catch drift from the public Polarion demo.

on:
  workflow_dispatch:
    inputs:
      spec_url:
        description: "OpenAPI spec URL (blank = public Polarion demo)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  # Regeneration runs code generated from a third-party spec (build + tests),
  # so it gets a read-only token that is not left in .git/config.
  regenerate:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.count.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Regenerate tools from the Polarion spec
        env:
          # Empty for scheduled runs -> the npm script falls back to the public demo.
          SPEC_URL: ${{ github.event.inputs.spec_url }}
        run: npm run regenerate

      - name: Report tool count
        id: count
        run: |
          echo "tools=$(grep -c 'name: "' src/tools.ts)" >> "$GITHUB_OUTPUT"

      - name: Keep the regenerated file
        uses: actions/upload-artifact@v4
        with:
          name: tools-ts
          path: src/tools.ts

  # Only this job can write, and it runs no generated code.
  pull-request:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Take the regenerated file
        uses: actions/download-artifact@v8
        with:
          name: tools-ts
          path: src

      # A PR opened with GITHUB_TOKEN does not trigger workflows. Dispatch CI
      # explicitly so the bot branch receives the full CI gate.
      - name: Open pull request if tools changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/update-polarion-tools
          base: main
          title: "chore: update Polarion tools from latest OpenAPI spec"
          commit-message: "chore: regenerate src/tools.ts (${{ needs.regenerate.outputs.tools }} tools)"
          body: |
            Automated regeneration of `src/tools.ts` from the Polarion OpenAPI definition.

            - Spec source: `${{ github.event.inputs.spec_url || 'public Polarion demo' }}`
            - Tool count: **${{ needs.regenerate.outputs.tools }}**
            - `npm run regenerate` (build + tests) passed before this PR was opened.

            CI does not run on bot PRs (GITHUB_TOKEN). Review the diff, then merge to ship the updated tool set.
          add-paths: |
            src/tools.ts
          delete-branch: true

      - name: Run CI on the bot branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref bot/update-polarion-tools
