name: Sonar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run coverage
        run: npm run test:coverage
      - name: Skip Sonar scan without token or for fork pull requests
        if: ${{ env.SONAR_TOKEN == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "::notice::Sonar scan skipped because SONAR_TOKEN is missing or this is a fork pull request."
      - name: Sonar scan
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
