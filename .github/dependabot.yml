version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Stay on the Node 22 type definitions that match "engines".
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 2.x replaces the module API; migrate deliberately, not through a bump.
      - dependency-name: "pdf-parse"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler rewrite; adopt it deliberately with a toolchain check.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
